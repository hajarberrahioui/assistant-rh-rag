# Jeu d'évaluation de l'assistant RH – version 1
#
# Champs :
#   id                  identifiant unique
#   categorie           normale | hors_perimetre | piege_obsolete | piege_injection | acces_restreint | cas_individuel | ambigue
#   question            la question posée
#   expected_doc_ids    documents qui contiennent la réponse (Recall@k : au moins un chunk de ces documents dans le top k)
#   expected_sections   (optionnel) sections précises attendues, ex. "Article 231"
#   must_contain        éléments obligatoires dans la réponse ; "a|b" = a OU b (insensible à la casse)
#   must_not_contain    éléments interdits dans la réponse (ex. info obsolète, fuite)
#   should_refuse       true si l'assistant doit refuser (question hors périmètre)
#   reponse_attendue    réponse de référence, pour la lecture humaine

# ---------------- Questions normales (20) ----------------
- id: Q01
  categorie: normale
  question: "Combien de jours de congé payé ai-je par an ?"
  expected_doc_ids: [CONG-002]
  must_contain: ["22"]
  reponse_attendue: "22 jours ouvrables par an (24 après 5 ans d'ancienneté)."

- id: Q02
  categorie: normale
  question: "J'ai 7 ans d'ancienneté, combien de jours de congé ai-je par an ?"
  expected_doc_ids: [CONG-002]
  must_contain: ["24"]
  reponse_attendue: "24 jours ouvrables (22 + 2 jours au-delà de 5 ans d'ancienneté)."

- id: Q03
  categorie: normale
  question: "Jusqu'à quand puis-je reporter mes congés non pris ?"
  expected_doc_ids: [CONG-002]
  must_contain: ["31 mars"]
  reponse_attendue: "Jusqu'au 31 mars de l'année suivante."

- id: Q04
  categorie: normale
  question: "Comment dois-je faire ma demande de congé ?"
  expected_doc_ids: [CONG-002]
  must_contain: ["portail"]
  reponse_attendue: "Via le portail RH, rubrique « Mes absences », 15 jours avant (congé de 5 jours ou plus) ou 5 jours avant (moins de 5 jours)."

- id: Q05
  categorie: normale
  question: "Combien de jours de congé ai-je pour mon mariage ?"
  expected_doc_ids: [CONG-002]
  must_contain: ["5 jours|cinq jours"]
  must_not_contain: ["4 jours"]
  reponse_attendue: "5 jours (congé exceptionnel rémunéré)."

- id: Q06
  categorie: normale
  question: "Combien de jours de télétravail par semaine sont autorisés ?"
  expected_doc_ids: [TT-001]
  must_contain: ["2 jours|deux jours"]
  reponse_attendue: "2 jours par semaine maximum (jusqu'à 4 jours temporairement dans certains cas)."

- id: Q07
  categorie: normale
  question: "Est-ce que je peux télétravailler le lundi ?"
  expected_doc_ids: [TT-001]
  must_contain: ["lundi"]
  reponse_attendue: "Non, le lundi est le jour de réunion d'équipe."

- id: Q08
  categorie: normale
  question: "Quel est le montant de l'indemnité de télétravail ?"
  expected_doc_ids: [TT-001]
  must_contain: ["150"]
  reponse_attendue: "150 dirhams par mois pour le télétravail régulier."

- id: Q09
  categorie: normale
  question: "Quel est le plafond de remboursement d'un repas en mission ?"
  expected_doc_ids: [FRAIS-001]
  must_contain: ["150"]
  reponse_attendue: "150 MAD par repas."

- id: Q10
  categorie: normale
  question: "Dans quel délai dois-je soumettre ma note de frais ?"
  expected_doc_ids: [FRAIS-001]
  must_contain: ["30 jours|trente jours"]
  reponse_attendue: "Dans les 30 jours après la fin de la mission."

- id: Q11
  categorie: normale
  question: "Quel est le prix maximum remboursé pour une nuit d'hôtel à Casablanca ?"
  expected_doc_ids: [FRAIS-001]
  must_contain: ["900"]
  reponse_attendue: "900 MAD par nuit."

- id: Q12
  categorie: normale
  question: "Combien de temps dure la période d'essai pour un cadre ?"
  expected_doc_ids: [ONB-001, CDT-001]
  must_contain: ["3 mois|trois mois"]
  reponse_attendue: "3 mois, renouvelable une fois."

- id: Q13
  categorie: normale
  question: "Quelle part de la mutuelle est prise en charge par l'entreprise ?"
  expected_doc_ids: [ONB-001]
  must_contain: ["70"]
  reponse_attendue: "70 %."

- id: Q14
  categorie: normale
  question: "En combien de temps dois-je envoyer mon certificat médical quand je suis malade ?"
  expected_doc_ids: [RI-001]
  must_contain: ["48"]
  reponse_attendue: "Dans les 48 heures à compter du premier jour d'absence."

- id: Q15
  categorie: normale
  question: "Combien d'heures travaille-t-on par jour pendant le Ramadan ?"
  expected_doc_ids: [RI-001]
  must_contain: ["6 heures|six heures|6 h"]
  reponse_attendue: "6 heures, de 9h00 à 15h00, sans pause déjeuner."

- id: Q16
  categorie: normale
  question: "Comment obtenir une attestation de travail ?"
  expected_doc_ids: [FAQ-001]
  must_contain: ["portail"]
  reponse_attendue: "Sur le portail RH, rubrique « Mes documents », disponible sous 48 heures ouvrables."

- id: Q17
  categorie: normale
  question: "Est-ce qu'il y a une prime de fin d'année ?"
  expected_doc_ids: [FAQ-001]
  must_contain: ["mois de salaire"]
  reponse_attendue: "Oui, un mois de salaire de base, versé en décembre, avec au moins 6 mois d'ancienneté."

- id: Q18
  categorie: normale
  question: "Que dit le Code du travail sur la durée du congé annuel payé ?"
  expected_doc_ids: [CDT-001]
  expected_sections: ["Article 231"]
  must_contain: ["jour et demi|1,5"]
  reponse_attendue: "Un jour et demi de travail effectif par mois de service, après six mois de service continu (article 231)."

- id: Q19
  categorie: normale
  question: "Quelle est la durée légale du travail par semaine selon le Code du travail ?"
  expected_doc_ids: [CDT-001]
  must_contain: ["44"]
  reponse_attendue: "44 heures par semaine dans les activités non agricoles."

- id: Q20
  categorie: normale
  question: "Combien de semaines dure le congé de maternité ?"
  expected_doc_ids: [CONG-002, CDT-001]
  must_contain: ["14 semaines|quatorze semaines"]
  reponse_attendue: "14 semaines."

