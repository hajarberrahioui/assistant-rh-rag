stages:
  ingest:
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
      - data/raw
    params:
      - ingest
    outs:
      - data/processed/chunks.jsonl
      - data/processed/quarantaine.json:
          cache: false        # petit rapport lisible : suivi par Git, pas par le cache DVC

  index:
    cmd: python src/index.py
    deps:
      - src/index.py
      - data/processed/chunks.jsonl
    params:
      - index
    outs:
      - data/index
