name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Installer les dépendances
        run: pip install -r requirements-ci.txt
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests unitaires et de configuration (pytest)
        run: pytest -v

  quality-gate:
    name: Quality gate
    needs: tests            # ne tourne que si le lint et les tests passent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Installer les dépendances
        run: pip install -r requirements-ci.txt
      - name: Vérifier la dernière évaluation (seuils + empreinte)
        run: python src/quality_gate.py
