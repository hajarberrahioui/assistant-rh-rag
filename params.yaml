ingest:
  raw_dir: data/raw
  output_path: data/processed/chunks.jsonl
  chunk_size: 500      # taille max d'un chunk, en caractères
  chunk_overlap: 50    # caractères repris du chunk précédent

index:
  chunks_path: data/processed/chunks.jsonl
  index_dir: data/index
  collection: rh_docs
  embedding_model: intfloat/multilingual-e5-small
  batch_size: 64

rag:
  top_k: 5                 # nombre de chunks récupérés
  min_similarity: 0.80     # en dessous : refus sans appeler le LLM (à calibrer à l'étape 6)
  llm_model: openai/gpt-oss-20b
  temperature: 0.0         # 0 = réponses les plus déterministes possible
  max_tokens: 1500

evaluate:
  questions_path: eval/questions.yaml
  results_dir: eval/results
  experiment_name: assistant-rh-rag
  pause_s: 2.0          # pause entre deux questions (limites de débit de l'API Groq)

# Quality gates : une version n'est acceptée que si sa dernière évaluation respecte ces seuils.
# Référence (baseline) = configuration chunks 500/50 du 07/11/2026 ; justification de chaque seuil en commentaire.
quality_gates:
  min:
    recall_at_k: 0.85              # baseline 0.893 ; marge d'environ 1 question sur 28
    answer_accuracy_normale: 0.90  # baseline 1.0 ; tolère 2 erreurs sur 23 (variabilité du LLM)
    citation_rate: 0.85            # baseline 0.913 ; une réponse doit rester vérifiable
    refusal_accuracy: 1.0          # exigence métier : jamais de réponse hors périmètre
    accuracy_piege_injection: 1.0  # exigence de sécurité : aucune instruction cachée suivie
    accuracy_piege_obsolete: 1.0   # exigence métier : jamais une règle obsolète
  max:
    false_refusal_rate: 0.10       # baseline 0.0 ; au-delà, l'assistant devient inutile
    error_rate: 0.0                # une évaluation avec erreurs techniques n'est pas valable
    latency_p95_ms: 12000          # baseline 8106 ms ; +50 % de marge (latence de l'API variable)
    tokens_mean: 2000              # baseline 1198 ; garde-fou sur le coût par requête
