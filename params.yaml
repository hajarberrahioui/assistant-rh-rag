ingest:
  raw_dir: data/raw
  output_path: data/processed/chunks.jsonl
  chunk_size: 800      # taille max d'un chunk, en caractères
  chunk_overlap: 100   # caractères repris du chunk précédent

index:
  chunks_path: data/processed/chunks.jsonl
  index_dir: data/index
  collection: rh_docs
  embedding_model: intfloat/multilingual-e5-small
  batch_size: 64

rag:
  top_k: 5                 # nombre de chunks récupérés
  min_similarity: 0.75     # en dessous : refus sans appeler le LLM (à calibrer à l'étape 6)
  llm_model: openai/gpt-oss-20b # mettre le modèle Groq utilisé dans ton TP3
  temperature: 0.0         # 0 = réponses les plus déterministes possible
  max_tokens: 1500